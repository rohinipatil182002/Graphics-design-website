<section class="client-upper-section container-fluid d-flex align-items-center">
  <div class="container-fluid" style="width: 85%;">
    <h2 class="client-title">Our Clients</h2>
    <p class="client-decription">
       Our clients are our top priority. We are proud to serve a diverse range of organizations,from corporate giants to government agencies. 
    </p>
  </div>
</section>

<section class="client-logo py-5">
  <div class="container-fluid" style="width: 85%;">
    <div class="row justify-content-center g-4">
      <div
        class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex justify-content-center"
        *ngFor="let logo of clientLogos"
      >
        <div class="card">
          <img [src]="logo" alt="Client Logo" class="client-img" />
        </div>
      </div>
    </div>
  </div>
</section>
